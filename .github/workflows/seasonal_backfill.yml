name: MLB Seasonal Backfill


on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year to backfill (e.g. 2021)'
        required: true
        type: string


jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mydb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_DSN: postgres://postgres:postgres@localhost:5432/mydb
      OUTPUT_DIR: stage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt

      - name: Backfill Statcast, PBP & Rosters
        run: |
          SEASON=${{ github.event.inputs.season }}
          python py/backfill.py --start "$SEASON-04-01" --end "$SEASON-10-03"

      - name: Test roster_player_id NULL migration (dry-run)
        env:
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_DSN:     ${{ secrets.PG_DSN }}
        run: |
          set -eo pipefail
          PSQL="psql \"$PG_DSN\" --echo-all --set ON_ERROR_STOP=on"
          $PSQL <<'EOF'
          BEGIN;
          \ir migrations/roster_player_id_null.sql
          ROLLBACK;
          EOF






      - name: Load Parquet into Postgres
        run: |
          python loader/load_parquet_into_pg.py

      - name: Backfill Lineups
        run: |
          SEASON=${{ github.event.inputs.season }}
          python py/lineup_etl.py --season "$SEASON"




