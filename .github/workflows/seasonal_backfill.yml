jobs:

  backfill:

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:15

        env:

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: postgres

          POSTGRES_DB: postgres

        ports:

          - 5432:5432

        options: >-

          --health-cmd pg_isready

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5


    env:

      PG_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"

      POSTGRES_HOST: localhost

      POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres


    steps:

      - uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r py/requirements.txt

      - name: Backfill Statcast, PBP & Roster

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/backfill.py --start "$SEASON-04-01" --end "$SEASON-10-01"

      - name: Load Parquet into Postgres

        run: |

          sleep 10  # give postgres a moment

          python loader/load_parquet_into_pg.py

      - name: Backfill Lineups

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/lineup_etl.py --season "$SEASON"
          
