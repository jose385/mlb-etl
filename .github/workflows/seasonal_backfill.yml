name: MLB Seasonal Backfill


on:

  workflow_dispatch:

    inputs:

      season:

        description: "Season year to backfill (e.g. 2021)"

        required: true

        type: string


jobs:

  backfill:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:

      PG_DSN: ${{ secrets.PG_DSN }}

      OUTPUT_DIR: stage

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    


    steps:

      - uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r py/requirements.txt

      - name: Backfill Statcast, PBP & Rosters

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/backfill.py --start "$SEASON-04-01" --end "$SEASON-10-03"

      - name: Load Parquet into Postgres

        run: |

          sleep 10

          python loader/load_parquet_into_pg.py

      - name: Backfill Lineups

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/lineup_etl.py --season "$SEASON"
