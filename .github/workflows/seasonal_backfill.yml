name: Seasonal Backfill

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year to backfill (e.g. 2021)'
        required: true
        type: string
      monthly:
        description: 'Fetch Statcast per month instead of day-by-day?'
        required: false
        type: boolean
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mydb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_DSN: postgresql://postgres:postgres@localhost:5432/mydb
      OUTPUT_DIR: stage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r py/requirements.txt

      - name: Create schema & tables
        run: |
          psql "$PG_DSN" << 'EOF'
            CREATE SCHEMA IF NOT EXISTS public;
            \i migrations/001_create_statcast_table.sql
            \i migrations/002_allow_roster_player_null.sql
          EOF

      - name: Backfill Statcast, PBP & Rosters
        run: |
          START="2021-04-01"
          END="2021-04-30"
          python3 py/backfill.py \
            --start "$START" \
            --end   "$END" \
            --monthly \
            --output stage

      - name: Load Parquet into Postgres
        env:    
          PG_DSN: postgresql://postgres:postgres@localhost:5432/mydb
        run: |
          python3 loader/load_parquet_into_pg.py \
            --input-dir stage \
            --tables statcast statsapi_playlog roster lineup



      - name: Backfill Lineups
        run: |
          SEASON=${{ github.event.inputs.season }}
          python3 py/lineup_etl.py --season "$SEASON"
