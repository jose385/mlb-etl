name: MLB Seasonal Backfill


on:

  workflow_dispatch:

    inputs:

      season:

        description: 'Season year to backfill (e.g. 2021)'

        required: true

        type: string


jobs:

  backfill:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:15

        env:

          POSTGRES_DB: mydb

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: postgres

        options: >-

          --health-cmd pg_isready

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5

        ports:

          - 5432:5432


    env:

      PG_DSN: postgresql://postgres:postgres@postgres:5432/mydb

      OUTPUT_DIR: stage


    steps:

      - uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r py/requirements.txt


      - name: Backfill Statcast, PBP & Rosters

        run: |

          python py/backfill.py --start 2021-04-01 --end 2021-10-03


      - name: Load Parquet into Postgres

        run: python loader/load_parquet_into_pg.py


        env:

          PG_DSN: ${{ env.PG_DSN }}


      - name: Backfill Lineups

        run: |

          python py/lineup_etl.py --season 2021

        env:

          PG_DSN: ${{ env.PG_DSN }}
          
