name: MLB Seasonal Backfill


on:

  workflow_dispatch:

    inputs:

      season:

        description: "Season year to backfill (e.g. 2021)"

        required: true

        type: string


jobs:

  backfill:

    runs-on: ubuntu-latest

    timeout-minutes: 120  # Allow extra time for large backfills

    env:

      PG_DSN: ${{ secrets.PG_DSN }}

      OUTPUT_DIR: stage

    steps:

      - uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r py/requirements.txt


      - name: Backfill Statcast, PBP & Rosters

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/backfill.py --start "$SEASON-04-01" --end "$SEASON-10-31"


      - name: Load Parquet into Postgres

        env:

          PG_DSN: ${{ secrets.PG_DSN }}

        run: |

          sleep 10  # Give DB a moment to become ready if needed

          python loader/load_parquet_into_pg.py


      - name: Backfill Lineups

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/lineup_etl.py --season "$SEASON"
          
