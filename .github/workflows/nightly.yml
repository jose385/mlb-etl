name: MLB Nightly ETL

on:

  schedule:

    - cron: '5 4 * * *'  # 00:05 ET

  workflow_dispatch:


jobs:

  etl:

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:16-alpine

        env:

          POSTGRES_USER: ghactions

          POSTGRES_PASSWORD: secret

          POSTGRES_DB: mlb

        ports:

          - 5432:5432


    env:

      PG_DSN: postgres://ghactions:secret@localhost:5432/mlb

      OUTPUT_DIR: stage

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


    steps:

      - uses: actions/checkout@v4


      - name: Cache pip

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: ${{ runner.os }}-pip-${{ hashFiles('py/requirements.txt') }}


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.12'


      - name: Install system dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y libpq-dev python3-dev build-essential


      - name: Install deps

        run: pip install -r py/requirements.txt

      - name: Pull Rosters

        run: python py/rosters_etl.py

        env:

          OUTPUT_DIR: stage

          PG_DSN: ${{ secrets.PG_DSN }}



      - name: Pull Statcast (pybaseball)

        run: python py/statcast_csv_pull.py


      - name: Pull StatsAPI data

        run: python py/statsapi_etl.py

- name: Pull Starting Lineups

  run: python py/lineup_etl.py --start_date 2021-04-01 --end_date $(date +%F)

  env:

    PG_DSN: ${{ secrets.PG_DSN }}
    




      - name: Load into Postgres

        run: python loader/load_parquet_into_pg.py

