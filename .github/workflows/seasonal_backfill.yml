name: MLB Seasonal Backfill


on:

  workflow_dispatch:

    inputs:

      season:

        description: "Season year to backfill (e.g. 2021)"

        required: true

        type: string


jobs:

  backfill:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:15

        env:

          # ← these belong here, _not_ in options:

          POSTGRES_DB: mydb

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: postgres

        ports:

          - 5432:5432

        options: >-

          # only health-check flags go here:

          --health-cmd "pg_isready -U postgres -d mydb"

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5



    timeout-minutes: 60

    env:

      #point at the local host postgres service above

      PG_DSN: postgresql://postgres:postgres@localhost:5432/mydb


      OUTPUT_DIR: stage

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    


    steps:

      - uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r py/requirements.txt

      - name: Backfill Statcast, PBP & Rosters

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/backfill.py --start "$SEASON-04-01" --end "$SEASON-10-03"

      - name: Load Parquet into Postgres

        run: |

          sleep 10

          python loader/load_parquet_into_pg.py

      - name: Backfill Lineups

        run: |

          SEASON=${{ github.event.inputs.season }}

          python py/lineup_etl.py --season "$SEASON"
