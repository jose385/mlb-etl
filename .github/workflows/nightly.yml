name: MLB Nightly ETL


on:

  schedule:

    - cron: '5 4 * * *'        # 00:05 ET

  workflow_dispatch:


jobs:

  etl:

    runs-on: ubuntu-latest

    env:

      OUTPUT_DIR: stage

      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      PG_DSN:                ${{ secrets.PG_DSN }}


    steps:

    - uses: actions/checkout@v4


    # ---------- cache pip so we don’t reinstall every run ----------

    - name: Cache pip

      uses: actions/cache@v4                         # pip cache how-to :contentReference[oaicite:4]{index=4}

      with:

        path: ~/.cache/pip

        key: ${{ runner.os }}-pip-${{ hashFiles('py/requirements.txt') }}


    # ---------- Python tool-chain ----------

    - name: Set up Python

      uses: actions/setup-python@v5                 # installs & adds to PATH :contentReference[oaicite:5]{index=5}

      with:

        python-version: '3.12'


    - name: Install deps

      run: pip install -r py/requirements.txt


    - name: Pull Statcast CSV

      run: python py/statcast_csv_pull.py


    - name: Pull StatsAPI data

      run: python py/statsapi_etl.py


    - name: Load into Postgres

      run: python loader/load_parquet_into_pg.py
      
