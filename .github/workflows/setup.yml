name: MLB Betting Analysis - Setup and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_full_test:
        description: 'Run full integration tests'
        required: false
        default: false
        type: boolean

jobs:
  setup-validation:
    name: Validate Setup Process
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
    
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 📦 Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('py/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: 📁 Test Directory Creation (Python)
        run: |
          echo "🧪 Testing Python directory creation..."
          python --version
          python setup_directories.py
          echo "✅ Python directory creation successful"
      
      - name: 📁 Test Directory Creation (Shell)
        run: |
          echo "🧪 Testing shell directory creation..."
          chmod +x create_dirs.sh
          ./create_dirs.sh
          echo "✅ Shell directory creation successful"
      
      - name: 🔍 Validate Directory Structure
        run: |
          echo "🔍 Validating directory structure..."
          python validate_setup.py
          echo "✅ Directory structure validation passed"
      
      - name: 📦 Install Dependencies
        run: |
          echo "📦 Installing Python dependencies..."
          python -m pip install --upgrade pip
          if [ -f py/requirements.txt ]; then
            pip install -r py/requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi
      
      - name: 🔧 Test Configuration Loading
        run: |
          echo "🔧 Testing configuration loading..."
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from py.config import get_config
              config = get_config()
              print('✅ Configuration loaded successfully')
              print(f'Features enabled: {len(config.get_enabled_features())}')
          except Exception as e:
              print(f'❌ Configuration loading failed: {e}')
              sys.exit(1)
          "
      
      - name: 🧪 Test Import Structure
        run: |
          echo "🧪 Testing Python import structure..."
          python -c "
          import sys
          sys.path.insert(0, '.')
          
          # Test core imports
          try:
              from py import config
              print('✅ py.config import successful')
          except ImportError as e:
              print(f'❌ py.config import failed: {e}')
              sys.exit(1)
          
          try:
              from py.config import get_config
              print('✅ get_config import successful')
          except ImportError as e:
              print(f'❌ get_config import failed: {e}')
              sys.exit(1)
          
          # Test optional imports
          optional_modules = [
              'py.enhanced_simple_backfill',
              'py.simple_analysis',
              'py.database',
              'py.s3_storage'
          ]
          
          for module in optional_modules:
              try:
                  __import__(module)
                  print(f'✅ {module} import successful')
              except ImportError as e:
                  print(f'⚠️ {module} import failed (may need dependencies): {e}')
          "
      
      - name: 🗂️ Verify File Structure
        run: |
          echo "🗂️ Verifying critical files exist..."
          
          critical_files=(
            "py/__init__.py"
            "py/config.py"
            "py/requirements.txt"
            "setup_directories.py"
            "setup_env.py"
            "check_env.py"
            "validate_setup.py"
            "create_dirs.sh"
            "migrations/001_enhanced_simple_schema.sql"
            "loader/enhanced_load_parquet_into_pg.py"
          )
          
          missing_files=()
          
          for file in "${critical_files[@]}"; do
            if [ -f "$file" ]; then
              echo "   ✅ $file"
            else
              echo "   ❌ $file"
              missing_files+=("$file")
            fi
          done
          
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo ""
            echo "❌ Missing critical files:"
            printf '   • %s\n' "${missing_files[@]}"
            exit 1
          else
            echo ""
            echo "✅ All critical files present"
          fi
      
      - name: 🔒 Test Directory Permissions
        run: |
          echo "🔒 Testing directory permissions..."
          
          writable_dirs=("stage" "logs" "backup")
          
          for dir in "${writable_dirs[@]}"; do
            if [ -d "$dir" ]; then
              if touch "$dir/.write_test" 2>/dev/null; then
                rm "$dir/.write_test"
                echo "   ✅ $dir is writable"
              else
                echo "   ❌ $dir is not writable"
                exit 1
              fi
            else
              echo "   ❌ $dir does not exist"
              exit 1
            fi
          done
      
      - name: 🧹 Test Cleanup
        run: |
          echo "🧹 Testing cleanup procedures..."
          
          # Create some test files
          touch stage/test.parquet
          touch logs/test.log
          
          # Test that files were created
          if [ ! -f "stage/test.parquet" ] || [ ! -f "logs/test.log" ]; then
            echo "❌ Failed to create test files"
            exit 1
          fi
          
          # Clean up
          rm -f stage/test.parquet logs/test.log
          
          # Verify cleanup
          if [ -f "stage/test.parquet" ] || [ -f "logs/test.log" ]; then
            echo "❌ Failed to clean up test files"
            exit 1
          fi
          
          echo "✅ Cleanup test successful"
      
      - name: 📊 Generate Setup Report
        run: |
          echo "📊 Generating setup validation report..."
          
          echo "## Setup Validation Report" > setup_report.md
          echo "**Date:** $(date)" >> setup_report.md
          echo "**Python Version:** $(python --version)" >> setup_report.md
          echo "**OS:** $(uname -a)" >> setup_report.md
          echo "" >> setup_report.md
          
          echo "### Directory Structure" >> setup_report.md
          echo '```' >> setup_report.md
          ls -la >> setup_report.md
          echo '```' >> setup_report.md
          echo "" >> setup_report.md
          
          echo "### Critical Files" >> setup_report.md
          echo '```' >> setup_report.md
          find . -name "*.py" -o -name "*.sql" -o -name "*.sh" | head -20 >> setup_report.md
          echo '```' >> setup_report.md
          
          cat setup_report.md
      
      - name: 📤 Upload Setup Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: setup-report-python${{ matrix.python-version }}
          path: setup_report.md
          retention-days: 30

  windows-setup-test:
    name: Windows Setup Test
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: 📁 Test PowerShell Directory Creation
        shell: powershell
        run: |
          Write-Host "🧪 Testing PowerShell directory creation..."
          .\Create-Directories.ps1
          Write-Host "✅ PowerShell directory creation successful"
      
      - name: 🔍 Validate Windows Setup
        shell: cmd
        run: |
          echo 🔍 Validating Windows setup...
          python validate_setup.py
          echo ✅ Windows setup validation passed

  macos-setup-test:
    name: macOS Setup Test
    runs-on: macos-latest
    timeout-minutes: 10
    
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: 📁 Test macOS Directory Creation
        run: |
          echo "🧪 Testing macOS directory creation..."
          python setup_directories.py
          echo "✅ macOS directory creation successful"
      
      - name: 🔍 Validate macOS Setup
        run: |
          echo "🔍 Validating macOS setup..."
          python validate_setup.py
          echo "✅ macOS setup validation passed"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [setup-validation]
    if: github.event.inputs.run_full_test == 'true' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_mlb
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt
      
      - name: 📁 Setup Directories
        run: |
          python setup_directories.py
      
      - name: ⚙️ Configure Test Environment
        run: |
          echo "PG_DSN=postgresql://test_user:test_password@localhost:5432/test_mlb" > .env
          echo "ENABLE_WEATHER=false" >> .env
          echo "ENABLE_S3_STORAGE=false" >> .env
          echo "DEBUG=true" >> .env
          echo "OUTPUT_DIR=stage" >> .env
          echo "MIGRATIONS_DIR=migrations" >> .env
          echo "LOG_DIR=logs" >> .env
      
      - name: 🗄️ Test Database Initialization
        run: |
          echo "🗄️ Testing database initialization..."
          python initialize_database.py --skip-validation
          echo "✅ Database initialization successful"
      
      - name: 🔍 Full Environment Check
        run: |
          echo "🔍 Running full environment check..."
          python check_env.py
          echo "✅ Full environment check passed"
      
      - name: 📊 Test Data Structure
        run: |
          echo "📊 Testing data structure..."
          python -c "
          from py.config import require_config
          config = require_config(require_database=True, require_weather=False)
          
          db_manager = config.get_database_manager()
          with db_manager.get_cursor() as cur:
              cur.execute('''
                  SELECT table_name 
                  FROM information_schema.tables 
                  WHERE table_schema = 'public'
                  ORDER BY table_name
              ''')
              tables = [row[0] for row in cur.fetchall()]
              
          expected_tables = [
              'games', 'play_by_play', 'game_info', 'weather',
              'umpires', 'lineups', 'rosters', 'recent_stats', 'venue_factors'
          ]
          
          missing_tables = set(expected_tables) - set(tables)
          if missing_tables:
              print(f'❌ Missing tables: {missing_tables}')
              exit(1)
          
          print(f'✅ All {len(expected_tables)} tables exist')
          print(f'Found tables: {tables}')
          "

  setup-summary:
    name: Setup Summary
    runs-on: ubuntu-latest
    needs: [setup-validation, windows-setup-test, macos-setup-test]
    if: always()
    
    steps:
      - name: 📋 Setup Results Summary
        run: |
          echo "# 📋 MLB Betting Analysis Setup Test Results"
          echo ""
          echo "## Test Results:"
          echo "- **Setup Validation**: ${{ needs.setup-validation.result }}"
          echo "- **Windows Test**: ${{ needs.windows-setup-test.result }}"
          echo "- **macOS Test**: ${{ needs.macos-setup-test.result }}"
          echo ""
          
          if [[ "${{ needs.setup-validation.result }}" == "success" && 
                "${{ needs.windows-setup-test.result }}" == "success" && 
                "${{ needs.macos-setup-test.result }}" == "success" ]]; then
            echo "🎉 **All setup tests passed!**"
            echo ""
            echo "✅ Directory creation works on all platforms"
            echo "✅ Python imports function correctly"
            echo "✅ File structure is complete"
            echo "✅ Cross-platform compatibility confirmed"
          else
            echo "❌ **Some setup tests failed**"
            echo ""
            echo "Please check the individual job logs for details."
          fi
          
          echo ""
          echo "## Next Steps for Users:"
          echo "1. Clone the repository"
          echo "2. Run: \`python setup_directories.py\`"
          echo "3. Run: \`python setup_env.py\`"
          echo "4. Run: \`python initialize_database.py\`"
          echo "5. Run: \`python check_env.py\`"