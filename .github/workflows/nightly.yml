name: MLB Nightly ETL

on:

  schedule:

    - cron: '5 4 * * *'  # 00:05 ET

  workflow_dispatch:


jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      PG_DSN: postgresql://postgres:postgres@localhost:5432/mydb
      OUTPUT_DIR: stage
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt

      - name: Backfill Statcast, PBP & Rosters
        run: |
          START="${{ github.event.inputs.season }}-04-01"
          END="${{ github.event.inputs.season }}-05-03"
          MONTHLY_FLAG=""
          if [ "${{ github.event.inputs.monthly }}" = "true" ]; then
            MONTHLY_FLAG="--monthly"
          fi

          python py/backfill.py --start "$START" --end "$END" $MONTHLY_FLAG
      - name: Load Parquet into Postgres
        run: |
          python3 loader/load_parquet_into_pg.py --stage stage

