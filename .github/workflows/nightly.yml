jobs:

  etl:

    runs-on: ubuntu-latest            # ← already in your file


    # 1️⃣  NEW – service container that GitHub spins up

    services:

      postgres:

        image: postgres:16-alpine     # all-lower-case, tag after the colon

        env:                          # credentials live here – NOT in options


          POSTGRES_USER:     ghactions

          POSTGRES_PASSWORD: secret

          POSTGRES_DB:       mlb

        ports:
          - 5432:5432                # exposes the DB on localhost:5432

        options: >-                  # health-check; one long string

          --health-cmd pg_isready

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5         # keep every flag lower-case

    # 2️⃣  Job-wide variables (now point at the service you just started)

    env:

      PG_DSN: postgres://ghactions:secret@localhost:5432/mlb

      OUTPUT_DIR: stage

      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


    # 3️⃣  The build steps you already have

    steps:

      - uses: actions/checkout@v4

      - name: Cache pip

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: ${{ runner.os }}-pip-${{ hashFiles('py/requirements.txt') }}


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install deps

        run: pip install -r py/requirements.txt


      - name: Pull Statcast (pybaseball)

        run: python py/statcast_csv_pull.py


      - name: Pull StatsAPI data

        run: python py/statsapi_etl.py


      - name: Load into Postgres

        run: python loader/load_parquet_into_pg.py
        
